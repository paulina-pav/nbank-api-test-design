name: Build image and run tests

on:
  push:
#  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push test image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build project
        run: mvn -B clean package -DskipTests=true

      - name: Run Checkstyle
        run: mvn -B verify -DskipTests=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nbank-tests:latest
          platforms: linux/amd64

  run-tests:
    name: Run API tests in Docker Compose
    needs: build-and-push
    if: ${{ needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests with Docker Compose
        working-directory: infra
        run: bash ./run-tests-with-docker-compose.sh

      - name: Upload surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: infra/test-output/**/report

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: infra/test-output/**/allure-results
      - name: Upload allure html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: infra/test-output/**/allure-report